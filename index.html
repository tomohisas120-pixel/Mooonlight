
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mooonlight</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Mooonlight</h1>
  <p>Keyboard & Mouse Input Display</p>

  <div id="keyboard">
    <div class="key" id="key-W">W</div>
    <div class="key" id="key-A">A</div>
    <div class="key" id="key-S">S</div>
    <div class="key" id="key-D">D</div>
    <div class="key" id="key-Space">SPACE</div>
    <div class="key" id="key-Shift">SHIFT</div>
  </div>

  <div id="mouse">
    <div class="key" id="mouse-left">LEFT CLICK</div>
    <div class="key" id="mouse-right">RIGHT CLICK</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
